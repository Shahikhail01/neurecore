name: AWL Architecture Gates

on:
  push:
    branches:
      - main
      - develop
      - 'feature/awl-*'
    paths:
      - 'backend/**'
      - '.github/workflows/awl-architecture.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/awl-architecture.yml'

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm exec prisma validate

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: TypeScript compile
        run: pnpm exec tsc --noEmit

      - name: Architecture tests
        run: pnpm exec jest --config jest.config.js src/test/architecture/tool-bypass.spec.ts src/test/architecture/circuit-breaker.spec.ts --runInBand

      - name: Built-in tool mutation scan
        run: |
          if rg -n "this\\.data\\.[A-Za-z0-9_]+\\.(create|update|delete|upsert|updateMany|deleteMany)|\\.prisma\\.[A-Za-z0-9_]+\\.(create|update|delete|upsert|updateMany|deleteMany)" src/modules/tools/built-in; then
            echo "Prohibited built-in tool mutation found."
            exit 1
          fi
          echo "No prohibited built-in tool mutations found."

      - name: Negative fixture proves guard fails closed
        run: |
          fixture="src/modules/tools/built-in/__test_negative__.ts"
          cat > "$fixture" <<'EOF'
          import { PrismaService } from '../../../infrastructure/database/prisma.service';

          export class BadTool {
            constructor(private readonly prisma: PrismaService) {}
            async bad() {
              return this.prisma.task.create({ data: {} as any });
            }
          }
          EOF

          set +e
          pnpm exec jest --config jest.config.js src/test/architecture/tool-bypass.spec.ts --runInBand > /tmp/awl-negative-fixture.out 2>&1
          status=$?
          set -e
          rm -f "$fixture"

          if [ "$status" -eq 0 ]; then
            echo "Negative fixture was not detected."
            cat /tmp/awl-negative-fixture.out
            exit 1
          fi

          if ! grep -q "Tool Prisma bypasses detected" /tmp/awl-negative-fixture.out; then
            echo "Architecture test failed, but not for the expected bypass reason."
            cat /tmp/awl-negative-fixture.out
            exit 1
          fi

          echo "Negative fixture detected as expected."

  focused-tests:
    name: focused-tests
    runs-on: ubuntu-latest
    needs: architecture
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Certification tests
        run: pnpm exec jest --config jest.config.js src/test/certification --runInBand

      - name: Built-in documents tool regression
        run: pnpm exec jest --config jest.config.js src/modules/tools/built-in/documents.tool.spec.ts --runInBand

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    needs: architecture
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neurecore_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: neurecore_awl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurecore_test -d neurecore_awl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://neurecore_test:test_password@localhost:5432/neurecore_awl_test
      AWL_REQUIRE_INTEGRATION_DB: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Seed AWL reconstruction flags
        run: pnpm run seed:awl-reconstruction

      - name: Run integration tests
        run: pnpm exec jest --config jest.config.js src/test/integration/golden-path-invariants.integration.spec.ts --runInBand
