<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style> .nav{fill:#0f172a} text{font-family:Arial, Helvetica, sans-serif;font-size:12px;fill:#0f172a} .label{font-size:11px;fill:#94a3b8}</style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="56" fill="#0b1220" />
  <text x="18" y="34" fill="#ffffff">TopBar (56px)</text>

  <!-- left nav collapsed (72px) -->
  <rect x="0" y="56" width="72" height="644" class="nav"/>
  <text x="8" y="84" fill="#ffffff">Collapsed Nav (72px)</text>

  <!-- right panel (24% = 288px) -->
  <rect x="912" y="56" width="288" height="644" fill="#111827"/>

  <!-- center area (remaining) -->
  <rect x="72" y="56" width="840" height="644" fill="#f8fafc" stroke="#e6eef8"/>
  <text x="84" y="84" class="label">Center / Main (collapsed nav)</text>

  <text x="18" y="690" class="label">Collapsed nav state — left:72px, center:840px, right:288px</text>
</svg>
