<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style> .muted{fill:#f3f4f6;stroke:#e5e7eb;stroke-width:1} .nav{fill:#111827} .panel{fill:#0f172a} .accent{fill:#e6eefb;stroke:#c6ddff} text{font-family:Arial, Helvetica, sans-serif;font-size:12px;fill:#0f172a} .label{font-size:11px;fill:#94a3b8}</style>
  </defs>
  <!-- background -->
  <rect width="1200" height="700" fill="#ffffff"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#0b1220" />
  <text x="18" y="34" fill="#ffffff">TopBar (56px)</text>

  <!-- left nav (14% = 168px) -->
  <rect x="0" y="56" width="168" height="644" class="nav"/>
  <text x="12" y="84" class="muted">LeftNav — 14% (168px)</text>

  <!-- right panel (24% = 288px) -->
  <rect x="912" y="56" width="288" height="644" class="panel"/>
  <text x="920" y="84" class="muted">RightPanel — 24% (288px)</text>

  <!-- center area (remaining) -->
  <rect x="168" y="56" width="744" height="644" fill="#f8fafc" stroke="#e6eef8"/>
  <text x="176" y="84" class="label">Center / Main (approx 58% — 744px)</text>

  <!-- greeting card -->
  <rect x="200" y="110" width="520" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="216" y="140">GreetingCard — H1 (avoid oversized)</text>

  <!-- quick actions -->
  <g transform="translate(200,250)">
    <rect width="520" height="80" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="8" y="24">QuickActionsGrid (icon tiles)</text>
  </g>

  <!-- KPI strip -->
  <g transform="translate(740,110)">
    <rect width="160" height="80" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="8" y="24">KPIWidgets (example)</text>
  </g>

  <!-- annotations -->
  <text x="18" y="690" class="label">Desktop full — left:168px, center:744px, right:288px</text>
</svg>
