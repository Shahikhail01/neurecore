<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="800" viewBox="0 0 375 800">
  <style> text{font-family:Arial, Helvetica, sans-serif;font-size:12px;fill:#0f172a} .muted{font-size:11px;fill:#94a3b8}</style>
  <rect width="375" height="800" fill="#ffffff"/>
  <!-- top bar -->
  <rect x="0" y="0" width="375" height="56" fill="#0b1220" />
  <text x="12" y="34" fill="#ffffff">TopBar (hamburger + search)</text>

  <!-- center content -->
  <rect x="12" y="80" width="351" height="500" rx="8" fill="#f8fafc" stroke="#e6eef8"/>
  <text x="22" y="110" class="muted">Center — main content (background optional)</text>

  <!-- right panel as modal overlay (hidden by default) -->
  <g id="right-panel" transform="translate(30,120)">
    <rect x="0" y="0" width="315" height="560" rx="8" fill="#0b1220" opacity="0.95"/>
    <text x="12" y="24" fill="#ffffff">RightPanel (modal on mobile)</text>
  </g>

  <text x="12" y="780" class="muted">Mobile — nav hidden / hamburger, right panel modal overlay</text>
</svg>
