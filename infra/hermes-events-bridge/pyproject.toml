[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-events-bridge"
version = "0.1.0"
description = "NeureCore Hermes events webhook receiver (Phase 1.4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0,<4.12.0",
]

[project.scripts]
hermes-events-bridge = "hermes_events_bridge.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_events_bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
