        - SLO-003
    pr_ai:
      severity: WARNING
      blocking: true
      requiredSlos:
        - SLO-001
    mainline:
      severity: WARNING
      blocking: true
      requiredSlos:
        - SLO-001
        - SLO-002
        - SLO-004
    nightly:
      severity: WARNING
      blocking: false
      requiredSlos:
        - SLO-001
        - SLO-002
        - SLO-003
        - SLO-004
        - SLO-005
        - SLO-006
    weekly:
      severity: WARNING
      blocking: false
      requiredSlos:
        - ALL
    release:
      severity: CRITICAL
