# NeureCore Harness SLO Policy v1
# Phase 0 - Governance, Inventory, and Threat Model
# Document ID: NC-HARNESS-SLO-POLICY-001
# Version: 1.1
# Status: PHASE_0_BASELINE (rectified 2026-08-02)

schemaVersion: "1.1"
policyVersion: "2026-08-02"

# ============================================================
# PURPOSE
# ============================================================

purpose: |
  This document defines Service Level Objectives (SLOs), error budgets,
  and measurement policies for the NeureCore harness platform.
  SLOs provide measurable reliability targets that the harness verifies
  through deterministic and statistical testing.

scope: |
  Applies to all 21 harness elements and their outputs, including:
  test results, certification verdicts, evidence artifacts, and
  performance metrics.

# ============================================================
# ZERO-TOLERANCE DIMENSIONS (Section 11 Gate Rules)
# These dimensions have zero tolerance per Section 11. They have NO
# waiver, NO error budget, and BLOCK release on any failure.
# These are independent of risk tier.
# ============================================================

zeroToleranceDimensions:
  - id: ZTD-001
    name: Tenant Isolation Breach
    rationale: Section 11 mandates zero tolerance for tenant isolation failures
    policy: BLOCK_RELEASE on any failure; no waiver; no error budget
  - id: ZTD-002
    name: Authorization Bypass
    rationale: Section 11 mandates zero tolerance for authorization failures
    policy: BLOCK_RELEASE on any failure; no waiver; no error budget
  - id: ZTD-003
    name: Audit Integrity Failure
    rationale: Section 11 mandates zero tolerance for audit integrity failures
    policy: BLOCK_RELEASE on any failure; no waiver; no error budget
  - id: ZTD-004
    name: Destructive Side Effect
    rationale: Section 11 mandates zero tolerance for destructive side effects
    policy: BLOCK_RELEASE on any failure; no waiver; no error budget
  - id: ZTD-005
    name: Duplicate Business Effect
    rationale: Section 11 mandates zero tolerance for duplicate business effects (idempotency)
    policy: BLOCK_RELEASE on any failure; no waiver; no error budget
  - id: ZTD-006
    name: AI Self-Approval
    rationale: AI cannot approve its own task (invariants mandatory)
    policy: BLOCK_RELEASE on any failure; no waiver; no error budget
  - id: ZTD-007
    name: Evidence Tampering
    rationale: Section 11 mandates zero tolerance for audit integrity
    policy: BLOCK_RELEASE on any failure; no waiver; no error budget

# ============================================================
# SLO DEFINITIONS
# Thresholds are NON-OVERLAPPING and mutually exclusive.
# Each level strictly covers a non-overlapping range.
# ============================================================

sloDefinitions:

  # ============================================================
  # CORE QUALITY SLOs (with non-overlapping thresholds)
  # ============================================================

  - sloId: SLO-001
    sloName: Critical Path Pass Rate
    sloDescription: Percentage of critical test scenarios that pass
    category: QUALITY
    riskTier: CRITICAL
    isZeroTolerance: false
    targetValue: 100
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Critical path scenarios represent the core functionality that
      must work for production deployment.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 100
        action: PASS
      - level: CRITICAL
        operator: LESS_THAN
        value: 100
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumRuns: 20
      minimumDistinctTenants: 2
    confidenceRequirements:
      confidenceLevel: 95
      acceptableErrorRate: 2

  - sloId: SLO-002
    sloName: Tenant Isolation Success Rate
    sloDescription: Percentage of tenant isolation tests that pass
    category: SECURITY
    riskTier: CRITICAL
    isZeroTolerance: true
    zeroToleranceDimension: ZTD-001
    targetValue: 100
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Tenant isolation is fundamental to multi-tenant security.
      Section 11 mandates zero tolerance.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 100
        action: PASS
      - level: CRITICAL
        operator: LESS_THAN
        value: 100
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumRuns: 50
      minimumDistinctTenants: 3
    confidenceRequirements:
      confidenceLevel: 99
      acceptableErrorRate: 0

  - sloId: SLO-003
    sloName: Authorization Enforcement Rate
    sloDescription: Percentage of authorization checks that correctly enforce policy
    category: SECURITY
    riskTier: CRITICAL
    isZeroTolerance: true
    zeroToleranceDimension: ZTD-002
    targetValue: 100
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Authorization failures can lead to data breaches and privilege escalation.
      Section 11 mandates zero tolerance.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 100
        action: PASS
      - level: CRITICAL
        operator: LESS_THAN
        value: 100
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumRuns: 100
      minimumDistinctRoles: 5

  # ============================================================
  # IDEMPOTENCY SLOs (with non-overlapping thresholds)
  # Duplicate suppression is now zero-tolerance (was previously budgeted)
  # ============================================================

  - sloId: SLO-004
    sloName: Duplicate Suppression Rate
    sloDescription: Percentage of duplicate submissions correctly suppressed
    category: CORRECTNESS
    riskTier: CRITICAL
    isZeroTolerance: true
    zeroToleranceDimension: ZTD-005
    targetValue: 100
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Duplicate submissions must not create duplicate business effects.
      Per Section 11 zero-tolerance on duplicate effects.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 100
        action: PASS
      - level: CRITICAL
        operator: LESS_THAN
        value: 100
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumRuns: 50
      minimumDuplicateAttemptsPerRun: 5

  - sloId: SLO-005
    sloName: Idempotency Key Reuse Correctness
    sloDescription: Percentage of idempotency key reuses returning correct cached result
    category: CORRECTNESS
    riskTier: HIGH
    isZeroTolerance: false
    targetValue: 99.9
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Idempotency keys must consistently return the same result for the same key.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 99.9
        action: PASS
      - level: WARNING
        operator: GREATER_THAN_OR_EQUAL
        value: 99.0
        action: REQUIRE_REVIEW
      - level: CRITICAL
        operator: LESS_THAN
        value: 99.0
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumRuns: 50

  # ============================================================
  # RECOVERY SLOs (with non-overlapping thresholds)
  # ============================================================

  - sloId: SLO-006
    sloName: Worker Recovery Rate
    sloDescription: Percentage of worker restart scenarios that recover correctly
    category: RECOVERY
    riskTier: HIGH
    isZeroTolerance: false
    targetValue: 99
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Worker restarts are expected events. The system must recover
      without data loss or duplicate effects.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 99
        action: PASS
      - level: WARNING
        operator: GREATER_THAN_OR_EQUAL
        value: 95
        action: REQUIRE_REVIEW
      - level: CRITICAL
        operator: LESS_THAN
        value: 95
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumRuns: 20
      minimumRestartAttemptsPerRun: 3

  - sloId: SLO-007
    sloName: Transient Failure Recovery Rate
    sloDescription: Percentage of transient failures that recover on retry
    category: RECOVERY
    riskTier: HIGH
    isZeroTolerance: false
    targetValue: 90
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Transient failures (network blips, temporary unavailability) should
      be retried successfully. Some failures are genuinely permanent.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 90
        action: PASS
      - level: WARNING
        operator: GREATER_THAN_OR_EQUAL
        value: 80
        action: REQUIRE_REVIEW
      - level: CRITICAL
        operator: LESS_THAN
        value: 80
        action: REQUIRE_INVESTIGATION
    sampleSizeRequirements:
      minimumRuns: 30
      minimumTransientFailuresPerRun: 5

  - sloId: SLO-008
    sloName: Session Expiry Resilience Rate
    sloDescription: Percentage of session expiry scenarios that handle gracefully
    category: RECOVERY
    riskTier: HIGH
    isZeroTolerance: false
    targetValue: 99
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Session expiry must be handled gracefully with clear user feedback.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 99
        action: PASS
      - level: WARNING
        operator: GREATER_THAN_OR_EQUAL
        value: 95
        action: REQUIRE_REVIEW
      - level: CRITICAL
        operator: LESS_THAN
        value: 95
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumRuns: 20

  # ============================================================
  # WORKFLOW SLOs (with non-overlapping thresholds)
  # ============================================================

  - sloId: SLO-009
    sloName: Revision Cycle Success Rate
    sloDescription: Percentage of revision cycles that complete correctly
    category: WORKFLOW
    riskTier: HIGH
    isZeroTolerance: false
    targetValue: 99
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Revision cycles (request revision -> resubmit -> review) must work correctly.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 99
        action: PASS
      - level: WARNING
        operator: GREATER_THAN_OR_EQUAL
        value: 95
        action: REQUIRE_REVIEW
      - level: CRITICAL
        operator: LESS_THAN
        value: 95
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumRuns: 20

  - sloId: SLO-010
    sloName: Socket Disabled Recovery Rate
    sloDescription: Percentage of socket disconnection scenarios that recover
    category: RECOVERY
    riskTier: HIGH
    isZeroTolerance: false
    targetValue: 99
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Real-time socket disconnection must not lose data or state.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 99
        action: PASS
      - level: WARNING
        operator: GREATER_THAN_OR_EQUAL
        value: 95
        action: REQUIRE_REVIEW
      - level: CRITICAL
        operator: LESS_THAN
        value: 95
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumRuns: 10

  # ============================================================
  # PERFORMANCE SLOs (with non-overlapping thresholds)
  # ============================================================

  - sloId: SLO-011
    sloName: API Response Time P50
    sloDescription: Median API response time
    category: PERFORMANCE
    riskTier: MEDIUM
    isZeroTolerance: false
    targetValue: 200
    unit: milliseconds
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Users expect responsive APIs.
    thresholds:
      - level: OK
        operator: LESS_THAN_OR_EQUAL
        value: 200
        action: PASS
      - level: WARNING
        operator: GREATER_THAN
        value: 200
        action: REQUIRE_INVESTIGATION
      - level: CRITICAL
        operator: GREATER_THAN
        value: 500
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumSamples: 1000
      percentiles: [50, 95, 99]

  - sloId: SLO-012
    sloName: API Response Time P95
    sloDescription: 95th percentile API response time
    category: PERFORMANCE
    riskTier: MEDIUM
    isZeroTolerance: false
    targetValue: 500
    unit: milliseconds
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      P95 represents the experience of slow requests.
    thresholds:
      - level: OK
        operator: LESS_THAN_OR_EQUAL
        value: 500
        action: PASS
      - level: WARNING
        operator: GREATER_THAN
        value: 500
        action: REQUIRE_INVESTIGATION
      - level: CRITICAL
        operator: GREATER_THAN
        value: 1000
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumSamples: 1000
      percentiles: [50, 95, 99]

  - sloId: SLO-013
    sloName: API Response Time P99
    sloDescription: 99th percentile API response time
    category: PERFORMANCE
    riskTier: MEDIUM
    isZeroTolerance: false
    targetValue: 1000
    unit: milliseconds
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      P99 represents the tail of the distribution.
    thresholds:
      - level: OK
        operator: LESS_THAN_OR_EQUAL
        value: 1000
        action: PASS
      - level: WARNING
        operator: GREATER_THAN
        value: 1000
        action: REQUIRE_INVESTIGATION
      - level: CRITICAL
        operator: GREATER_THAN
        value: 2000
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumSamples: 1000
      percentiles: [50, 95, 99]

  - sloId: SLO-014
    sloName: Error Rate
    sloDescription: Percentage of API requests that result in errors
    category: PERFORMANCE
    riskTier: HIGH
    isZeroTolerance: false
    targetValue: 0.1
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Error rate should be minimal in production.
    thresholds:
      - level: OK
        operator: LESS_THAN_OR_EQUAL
        value: 0.1
        action: PASS
      - level: WARNING
        operator: GREATER_THAN
        value: 0.1
        action: REQUIRE_INVESTIGATION
      - level: CRITICAL
        operator: GREATER_THAN
        value: 1
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumSamples: 10000

  # ============================================================
  # EVIDENCE SLOs (audit integrity is zero tolerance per Section 11)
  # ============================================================

  - sloId: SLO-015
    sloName: Evidence Completeness Rate
    sloDescription: Percentage of runs that produce complete evidence
    category: COMPLIANCE
    riskTier: CRITICAL
    isZeroTolerance: true
    zeroToleranceDimension: ZTD-003
    targetValue: 100
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Every run must produce evidence for certification. Audit integrity
      is zero tolerance per Section 11.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 100
        action: PASS
      - level: CRITICAL
        operator: LESS_THAN
        value: 100
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumRuns: 50

  - sloId: SLO-016
    sloName: Evidence Integrity Rate
    sloDescription: Percentage of evidence artifacts that pass integrity checks
    category: COMPLIANCE
    riskTier: CRITICAL
    isZeroTolerance: true
    zeroToleranceDimension: ZTD-007
    targetValue: 100
    unit: percent
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Evidence integrity is essential for certification validity.
      Section 11 mandates zero tolerance for audit integrity.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 100
        action: PASS
      - level: CRITICAL
        operator: LESS_THAN
        value: 100
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumRuns: 50

  # ============================================================
  # LOAD SLOs (with non-overlapping thresholds)
  # ============================================================

  - sloId: SLO-017
    sloName: Concurrent Tenant Performance
    sloDescription: Performance degradation threshold under concurrent tenant load
    category: LOAD
    riskTier: MEDIUM
    isZeroTolerance: false
    targetValue: 20
    unit: percent_degradation
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      Performance should not degrade more than 20% under concurrent load.
    thresholds:
      - level: OK
        operator: LESS_THAN_OR_EQUAL
        value: 20
        action: PASS
      - level: WARNING
        operator: GREATER_THAN
        value: 20
        action: REQUIRE_INVESTIGATION
      - level: CRITICAL
        operator: GREATER_THAN
        value: 50
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumConcurrentTenants: 10
      minimumRequestsPerTenant: 100

  - sloId: SLO-018
    sloName: Throughput Under Load
    sloDescription: Requests per second under sustained load
    category: LOAD
    riskTier: MEDIUM
    isZeroTolerance: false
    targetValue: 100
    unit: requests_per_second
    measurementWindow: per_release
    currentBaseline: null
    status: NOT_ESTABLISHED
    rationale: |
      System must sustain minimum throughput under load.
    thresholds:
      - level: OK
        operator: GREATER_THAN_OR_EQUAL
        value: 100
        action: PASS
      - level: WARNING
        operator: LESS_THAN
        value: 100
        action: REQUIRE_INVESTIGATION
      - level: CRITICAL
        operator: LESS_THAN
        value: 50
        action: BLOCK_RELEASE
    sampleSizeRequirements:
      minimumLoadDuration: 300
      rampUpDuration: 60

# ============================================================
# ERROR BUDGET POLICY
# Zero-tolerance dimensions have ZERO error budget.
# Non-zero-tolerance SLOs have budgets as defined below.
# ============================================================

errorBudgetPolicy:
  description: |
    Error budgets define how much failure is acceptable within an SLO window.
    When error budget is exhausted, corrective action is required.
    Zero-tolerance dimensions (per Section 11) have ZERO budget.

  zeroBudgetSlos:
    - SLO-002
    - SLO-003
    - SLO-004
    - SLO-015
    - SLO-016

  rules:
    - sloId: SLO-001
      budgetPercentage: 0
      exhaustionAction: BLOCK_RELEASE
      reviewRequired: true

    - sloId: SLO-005
      budgetPercentage: 0.1
      exhaustionAction: REQUIRE_INVESTIGATION
      reviewRequired: true

    - sloId: SLO-006
      budgetPercentage: 1
      exhaustionAction: REQUIRE_INVESTIGATION
      reviewRequired: true

    - sloId: SLO-007
      budgetPercentage: 10
      exhaustionAction: REQUIRE_INVESTIGATION
      reviewRequired: true

    - sloId: SLO-008
      budgetPercentage: 1
      exhaustionAction: REQUIRE_INVESTIGATION
      reviewRequired: true

    - sloId: SLO-009
      budgetPercentage: 1
      exhaustionAction: REQUIRE_INVESTIGATION
      reviewRequired: true

    - sloId: SLO-010
      budgetPercentage: 1
      exhaustionAction: REQUIRE_INVESTIGATION
      reviewRequired: true

# ============================================================
# STATISTICAL REQUIREMENTS
# Per Section 8.2: "use at least two independent signals for critical subjective gates"
# Repetition policy uses DISTINCT seeds, not the same seed.
# ============================================================

statisticalRequirements:
  confidenceLevel: 95
  minimumSampleSizes:
    deterministic: 1
    statistical: 30
    performance: 1000
  acceptableVariance:
    performance: 10
    quality: 5
  outlierHandling: |
    Outliers (beyond 3 standard deviations) are excluded from
    average calculations but included in P99 calculations.
    Outliers are flagged for investigation.
  repetitionPolicy: |
    Non-deterministic scenarios require minimum 5 repetitions across
    DISTINCT random seeds (not the same seed). Two independent signals
    required for critical subjective gates (Section 8.2).
    Results reported as: mean ± confidence_interval.
    Insufficient-evidence outcomes (sample < minimum, missing data, or
    indeterminate) are tracked separately per Section 11 and never
    converted to pass.

