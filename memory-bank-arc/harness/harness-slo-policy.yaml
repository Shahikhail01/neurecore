      A registered SLO policy must also have approvedBy/approvedAt/approvedEnvironment
      populated; otherwise the gate reports `policyEnforceable=false`.
    sloMappings:
      - sloId: SLO-011
        phase8Profile: BASELINE_WARM, BASELINE_COLD
        phase8Metric: latency.p50Ms
      - sloId: SLO-012
        phase8Profile: SPIKE, STRESS, BASELINE_WARM, BASELINE_COLD
        phase8Metric: latency.p95Ms
      - sloId: SLO-013
        phase8Profile: STRESS, SPIKE
        phase8Metric: latency.p99Ms
      - sloId: SLO-014
        phase8Profile: PROVIDER_THROTTLE, QUEUE_PRESSURE, DB_PRESSURE, CACHE_PRESSURE
        phase8Metric: errorRate
      - sloId: SLO-017
        phase8Profile: CONCURRENT_TENANTS
        phase8Metric: regressionVerdict + isolationVerdict
      - sloId: SLO-018
        phase8Profile: STRESS, SOAK
        phase8Metric: throughputRps
    gateEnforcement:
      releaseBlocking: true
      requiresApprovedSloPolicy: true
      requiresRealEnvironmentClass: true
      simBehavior: |
        Phase 8 always emits a capacity report; the report verdict is
        `SIMULATED_NO_PRODUCTION_CLAIM`. The release capacity gate blocks
        release promotion regardless of report status when environmentClass is
        SIMULATED. This behavior is enforced by `ReleaseCapacityGate` in
        `backend/src/harness/phase8/ci-lane.ts` and exercised by
        `Phase 8 / Conformance / Release capacity gate` conformance suite.
    approvedPolicies: []
  phase0Action: |
    Phase 0 establishes the SLO framework and zero-tolerance policy.
    Actual baseline measurements will be collected during Phase 8 (Performance and Load)
    and integrated into CI/CD gates during Phase 9 (Release Gates).