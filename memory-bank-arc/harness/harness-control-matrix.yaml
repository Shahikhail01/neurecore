schemaVersion: "1.1"
matrixVersion: "2026-08-02"

# ============================================================
# CONTROL FRAMEWORK MAPPING
# ============================================================
# This matrix maps security and compliance controls to executable harness checks.
# Controls are categorized by domain and mapped to specific test scenarios.
# Every check MUST reference a real, existing test (path + exact Jest title) or
# be explicitly marked PLANNED with phase/sprint target.

controlDomains:
  - SECURITY
  - TENANT_ISOLATION
  - DATA_PROTECTION
  - AUDIT_INTEGRITY
  - AUTHORIZATION
  - EVIDENCE_IMMUTABILITY
  - SESSION_MANAGEMENT
  - INPUT_VALIDATION
  - CRYPTOGRAPHY
  - INCIDENT_RESPONSE
  - SUPPLY_CHAIN

# ============================================================
# SECURITY CONTROLS
# ============================================================

