  # AUTHENTICATION & AUTHORIZATION CONTROLS
  # ============================================================

  - controlId: SEC-AUTH-001
    controlName: Multi-Tenant Authentication Enforcement
    controlDomain: SECURITY
    controlType: PREVENTIVE
    riskCategory: CRITICAL
    zeroTolerance: true
    zeroToleranceDimension: ZTD-002
    description: All API endpoints must enforce tenant authentication and reject requests without valid tenant context
    mappedRequirements:
      - REQ-001: All endpoints must validate tenantId from authenticated context
      - REQ-002: Anonymous requests to protected endpoints must be rejected with 401
    executableChecks:
      - checkId: SEC-AUTH-001-TC-001
        checkName: Session token from tenant A cannot access tenant B
        testPath: backend/src/test/certification/cross-tenant-negative.spec.ts
        testName: 'cookie/session token from tenant A cannot access tenant B'
        executionMode: DETERMINISTIC
        passCriteria: HTTP 401 or 403 returned
        status: ACTIVE
      - checkId: SEC-AUTH-001-TC-002
        checkName: HTTP controller rejects cross-tenant path
        testPath: backend/src/test/certification/cross-tenant-negative.spec.ts
        testName: 'HTTP controller rejects cross-tenant path'
        executionMode: DETERMINISTIC
        passCriteria: HTTP 404 or 403 returned
        status: ACTIVE
    currentStatus: COVERED
    owner: Security
    lastTested: "2026-07-27"
    evidenceRef: backend/src/test/certification/cross-tenant-negative.spec.ts

  - controlId: SEC-AUTH-002
    controlName: Role-Based Access Control
    controlDomain: SECURITY
    controlType: PREVENTIVE
    riskCategory: HIGH
    description: Users must only access resources permitted by their assigned roles
    mappedRequirements:
      - REQ-003: Role-based permissions enforced at controller layer
      - REQ-004: Admin actions require admin role
    executableChecks:
      - checkId: SEC-AUTH-002-TC-001
        checkName: ApproveInitiation handler rejects cross-tenant actor
        testPath: backend/src/test/certification/cross-tenant-negative.spec.ts
        testName: 'ApproveInitiation handler must not be invoked when actor tenant differs from record'
        executionMode: DETERMINISTIC
        passCriteria: Handler rejects with appropriate error
        status: ACTIVE
    currentStatus: PARTIAL
    owner: Security
    lastTested: "2026-07-27"
    evidenceRef: backend/src/test/certification/cross-tenant-negative.spec.ts
    gapReason: "RBAC roles beyond tenant scope not exhaustively tested; test coverage limited to tenant isolation in cross-tenant actor context"

  - controlId: SEC-AUTH-003
    controlName: Service Identity Authentication
    controlDomain: SECURITY
    controlType: PREVENTIVE
    riskCategory: HIGH
    description: Inter-service communication must use service identities
    mappedRequirements:
